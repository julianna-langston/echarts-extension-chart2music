<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>echarts-extension-chart2music example</title>
    <script type="importmap">
      {
        "imports": {
          "chart2music": "../node_modules/chart2music/dist/index.mjs"
        }
      }
    </script>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
      }

      #chart {
        height: 360px;
        max-width: 720px;
      }
    </style>
  </head>
  <body>
    <div id="chart"></div>
    <script type="module">
      import * as echarts from "../node_modules/echarts/dist/echarts.esm.mjs";
      import extension, { connect } from "../dist/index.js";

      echarts.use([extension]);

      const chart = echarts.init(document.getElementById("chart"));
      chart.setOption({
        title: { text: "Quarterly revenue" },
        tooltip: {},
        xAxis: { data: ["Q1", "Q2", "Q3", "Q4"] },
        yAxis: {},
        series: [{ name: "Revenue", type: "bar", data: [12, 19, 8, 15] }]
      });

      connect(chart, {
        errorCallback: console.error,
        axes: {
          y: {
            format: (value) => `$${value}M`
          }
        }
      });
    </script>
  </body>
</html>
